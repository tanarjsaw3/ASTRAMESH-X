version: "3.8"

services:
  astromesh-x:
    build:
      context: .
      dockerfile: Dockerfile
    image: astromesh-x:latest
    container_name: astromesh_mission_control
    ports:
      - "8080:8080"
      - "29999:29999/udp"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - ASTROMESH_SIM_RUNNER=/app/bin/sim_runner
    volumes:
      - ./scratch:/app/scratch
    restart: unless-stopped
