# ==============================================================================
# Render.com Blueprint Specification for AstroMesh-X
# https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: astromesh-x
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
